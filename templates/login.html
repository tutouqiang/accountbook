{% extends "base.html" %}
{% block title %}登录 - 个人记账本{% endblock %}

{% block content %}
<div class="auth-wrap">
  <h2>登录</h2>
  <form method="post">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" name="username" required autofocus>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn" style="width:100%;">登录</button>
  </form>
  <p class="tip">还没有账号？<a href="{{ url_for('register') }}">去注册</a></p>
</div>
{% endblock %}
